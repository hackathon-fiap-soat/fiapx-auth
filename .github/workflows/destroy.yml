name: Destroy · Lambdas de auth e rotas do API Gateway

# Chamado pelo destroy-all do fiapx-infra (ADR-018), depois do video-api e antes da infraestrutura.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Chamado pelo destroy-all, aparece como "3 · Auth (Lambdas e rotas) / Remover".
  destroy:
    name: Remover
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    steps:
      - name: Baixar o fiapx-auth
        uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-auth }
      - name: Autenticar na AWS Academy e garantir o bucket do state
        id: aws
        uses: hackathon-fiap-soat/fiapx-infra/.github/actions/aws-lab@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.15.8, terraform_wrapper: false }
      # O destroy não lê o pacote, mas a variável lambda_zip precisa apontar para um arquivo.
      - name: Criar um zip vazio (o Terraform exige o arquivo)
        run: mkdir -p dist && touch dist/fiapx-auth.zip
      - name: Destruir as Lambdas, as rotas e o authorizer (Terraform)
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ steps.aws.outputs.state-bucket }}"
          terraform destroy -auto-approve -input=false -lock-timeout=10m
