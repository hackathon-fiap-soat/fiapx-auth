name: deploy

# Deploy das Lambdas e das rotas /api/auth/* (ADR-018): no merge na main e chamado pelo deploy-all do
# fiapx-infra. Credenciais da AWS Academy em Secrets (ADR-019). Com o ambiente destruído, falha ao ler o SSM.
on:
  push:
    branches: [main]
    # Mudança só de documentação ou de contexto do Claude não reimplanta o serviço.
    paths-ignore: ["**.md", ".claude/**", "docs/**", "LICENSE"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fiapx-auth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { repository: hackathon-fiap-soat/fiapx-auth }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - name: Pacote das Lambdas
        run: npm run build
      - id: aws
        uses: hackathon-fiap-soat/fiapx-infra/.github/actions/aws-lab@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Ambiente no ar?
        run: |
          for p in apigw/api_id sqs/notification-commands/url db/auth/secret_arn; do
            aws ssm get-parameter --name "/fiapx/prod/$p" >/dev/null 2>&1 || {
              echo "::error::Falta /fiapx/prod/$p. Ambiente fora do ar ou fora de ordem: rode o deploy-all no fiapx-infra."
              exit 1
            }
          done
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.15.8, terraform_wrapper: false }
      - name: Terraform apply (Lambdas, rotas e authorizer)
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ steps.aws.outputs.state-bucket }}"
          terraform apply -auto-approve -input=false -lock-timeout=10m
      - name: Migrations (Lambda migrate, dentro da VPC)
        run: |
          set -euo pipefail
          nome=$(terraform -chdir=infra output -json lambda_names | jq -r .migrate)
          aws lambda wait function-updated-v2 --function-name "$nome"
          aws lambda invoke --function-name "$nome" --cli-read-timeout 120 /tmp/migrate.json > /tmp/invoke.json
          cat /tmp/migrate.json; echo
          if jq -e '.FunctionError' /tmp/invoke.json >/dev/null; then
            echo "::error::As migrations falharam (veja o log acima e o CloudWatch da Lambda $nome)."
            exit 1
          fi
      - name: Resumo
        run: |
          {
            echo "### fiapx-auth implantado"
            echo "- Rotas: $(terraform -chdir=infra output -json routes | jq -r 'join(", ")')"
            echo "- Authorizer: $(terraform -chdir=infra output -raw authorizer_id)"
          } >> "$GITHUB_STEP_SUMMARY"
